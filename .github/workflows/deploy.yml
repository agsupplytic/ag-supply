name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# No se cancela un despliegue en curso: cortar una subida FTP a la mitad deja el sitio incompleto.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # el sitemap usa la fecha del ultimo cambio de contenido
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_KEY }}
          # Contenedor de Google Tag Manager (público: va en el HTML). Solo carga con consentimiento.
          NEXT_PUBLIC_ANALYTICS_ID: GTM-5NPH9GL9
      - run: npm run check:out
      - run: npm run check:i18n
      - name: Subir out/ a Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /domains/agsupply.com.do/public_html/
