name: FTP debug (solo lectura)

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Rutas absolutas del FTP
        env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          ls_abs() { echo "== $1"; curl -s --ftp-pasv -u "$U:$P" "ftp://$H/$1" --list-only | head -40; echo; }
          ls_abs "/"
          ls_abs "/public_html/"
          ls_abs "/domains/"
          ls_abs "/domains/agsupply.com.do/"
          ls_abs "/domains/agsupply.com.do/public_html/"
          echo "== default.php en la carpeta inicial?"
          curl -s --ftp-pasv -u "$U:$P" "ftp://$H/" --list-only | grep -c default.php || true
