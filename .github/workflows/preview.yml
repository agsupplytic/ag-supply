name: Vista previa (GitHub Pages)

# Publica la rama de trabajo en https://agsupplytic.github.io/ag-supply/ para revisarla
# antes de fusionar. No toca producción (Hostinger se despliega solo desde main) y la
# vista previa va con noindex/Disallow. Requiere: Settings → Pages → Source: GitHub Actions,
# y permitir esta rama en Settings → Environments → github-pages.
on:
  push:
    branches: [claude/loving-lovelace-fnlkqn]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /ag-supply
          NEXT_PUBLIC_PREVIEW: "1"
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
